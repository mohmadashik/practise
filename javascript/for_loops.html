    <body>
        Hello To For Loops        

        <script>
            console.log('Hello World')

            console.log('i is defined with let inside for loop');
        
            for (let i=0;i<5;i+=1)
            {
                console.log(`i is ${i}`);
            }

            console.log('i is defined with let inside for loop');


            for (let i = 10; i>6;i--)
            {
                console.log(`i is ${i}`);
            }

            console.log('i is defined with var inside for loop');
            for (var i = 1; i<10;i++)
            {
                console.log(`i is ${i}`);
            }
            console.log('i is defined with var inside for loop');
            for (var i = 1; i<10;i++)
            {
                console.log(`i is ${i}`);
            }
            var name ='ashik';
            console.log(` name defined with var is ${name}`);
            var name = 'super hero';
            console.log(`name defined with var again is working ${name}`);


            let check ='ashik';
            console.log(` check defined with let is ${check}`);
            console.log(`check defined with let again is not working error ${check}`);

        </script>

    </body>
